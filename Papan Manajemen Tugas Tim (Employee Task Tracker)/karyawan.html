<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Portal Tugas - Karyawan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Portal Tugas Karyawan</h1>
      <p>Pantau dan perbarui progres tugas yang diberikan kepadamu</p>
    </header>

    <div class="card">
      <h2>Daftar Tugas Saya</h2>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Judul & Deskripsi</th>
              <th>Penerima Tugas</th>
              <th>Prioritas</th>
              <th>Deadline</th>
              <th>Status</th>
              <th>Ubah Progress Status</th>
            </tr>
          </thead>
          <tbody id="tabel-body-karyawan">
            <!-- Data dimasukkan via JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="karyawan.js"></script>
</body>
</html>
